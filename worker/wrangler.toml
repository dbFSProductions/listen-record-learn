name = "xerra-card-assistant"
main = "src/index.js"
compatibility_date = "2026-08-19"

[vars]
# One release behind the newest Flash on purpose: 3.7 Flash shipped 2026-08-13
# and spent its first weeks returning 503 "model is overloaded" for most card
# generations. Revisit once its capacity has settled.
GEMINI_MODEL = "gemini-3.6-flash"
# Tried only when the primary is rate-limited, overloaded, or retired. Set to
# "" to fail instead of falling back.
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
# Leads the chain for the two short conversational calls, /interview and /chat,
# which don't need the bigger model to ask where you live. They still fall back
# to GEMINI_MODEL if this one fails. Set it equal to GEMINI_MODEL to put those
# calls back on the big model without a code change.
GEMINI_FAST_MODEL = "gemini-3.5-flash-lite"
# The one call that draws instead of writing: /picture, which turns a keyword
# mnemonic ("a ten-pound note pinned to a door with a fork") into an image.
# It has no fallback — nothing else in the chain can draw — so a wrong id here
# is a 404 naming this variable rather than a silent downgrade.
#
# Only used when REPLICATE_API_TOKEN is NOT set. The drawings go through
# Replicate now; this is the path back if that account ever goes away.
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"

# /picture draws through Replicate. Needs one secret, which is not in this file
# and must never be:
#
#     wrangler secret put REPLICATE_API_TOKEN --cwd worker
#
# Unset the secret and /picture falls back to GEMINI_IMAGE_MODEL above. Note
# that the Gemini image path has never actually drawn anything — it was written
# from the API docs and could not be exercised without a Gemini key — whereas
# this one was checked end to end on the real Palabras cards before it shipped.
#
# nano-banana-2 is Gemini's own image model reached through Replicate, chosen
# over flux-schnell, ideogram-v3-turbo and seedream-4 after drawing the same
# cards on all four. The diffusion models ignore "no lettering" and write the
# Spanish word onto the card — flux spelled it "el tenddor" — which is the one
# failure this unit cannot carry. See DEFAULT_REPLICATE_MODEL in src/index.js.
REPLICATE_MODEL = "google/nano-banana-2"
# Model-specific input fields, as JSON. Replicate 422s on a field the model
# does not declare, so these travel with the model id above rather than being
# hardcoded. Empty or invalid falls back to sending only the prompt, which
# every model tried accepts.
REPLICATE_INPUT = '{"aspect_ratio":"1:1","resolution":"1K","output_format":"jpg"}'
# The Catalan voices in /speak come from Matxa-TTS on a Hugging Face Space,
# not from Replicate. The Space serves both Matxa checkpoints over a plain HTTP
# API and needs no image built, no Cog package and no CI pipeline — which is the
# whole reason it is a Space and not a Replicate model.
#
# The default below is the Barcelona Supercomputing Center's own Space. Point it
# at your own duplicate of it to stop depending on somebody else's demo staying
# up:
#
#     huggingface.co/spaces/BSC-LT/matxa-tts-v2  ->  Duplicate this Space
#     wrangler secret put HF_TOKEN --cwd worker   (only for a private one)
#
# A free Space sleeps after 48 hours idle and takes about a minute to wake,
# which is longer than /speak waits — so the first Listen after a long gap falls
# back to the browser voice and the next one works. Daily use never sleeps.
MATXA_SPACE = "bsc-lt-matxa-tts-v2.hf.space"
# Temperature and pace, as JSON. 0.2 rather than the model's own 0.667: at the
# default the voices came back from the phone as having "a few artifacts", and
# at 0.2 the same voices were "much better". Lower is a steadier sampler, and
# steady is what a voice you are copying should be.
MATXA_INPUT = '{"temperature":0.2,"length_scale":1.0}'

# /speak also still speaks Replicate, for any voice that is not one of Matxa's
# — the fork is per voice, in speakLine. Catalan goes to Matxa; nothing else
# has a voice here at present.
#
# The six MiniMax voices that used to be listed for all three languages are
# gone: Catalan was on that model's supported-language list, and the phone
# reported they "sound french or italian". A multilingual model listing a
# language is not a model that speaks it, which is what Matxa exists to fix.
#
# The original note follows, since the Replicate path itself is unchanged.
# /speak reads a phrase aloud, on the same Replicate token as the drawings.
# Unset the token and the endpoint answers 503 saying so; the app then offers
# only the Azure voices, which is exactly what it did before this existed.
#
# minimax/speech-02-hd is the default because Catalan is on its own language
# list and it takes a plain system voice id rather than a reference recording.
# It has NOT been listened to in Catalan from this repo — no Catalan ear ships
# in a Worker — so treat this pair as the knob to turn if the voices are wrong:
# the app's voice list names the ids, and *Check this card* in the app scores
# the model's own bytes against Azure, which is how to tell a good Catalan
# voice from a Spanish-accented one before drilling on it.
REPLICATE_VOICE_MODEL = "minimax/speech-02-hd"
# Model-specific input fields, as JSON, exactly like REPLICATE_INPUT above:
# Replicate 422s on a field the model does not declare. text, voice_id,
# language_boost and speed are built per request and are not settable here.
REPLICATE_VOICE_INPUT = '{"sample_rate":32000,"bitrate":128000,"channel":"mono","english_normalization":false}'
ALLOWED_ORIGINS = "https://dbfsproductions.github.io,http://127.0.0.1:8765,http://localhost:8765"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
