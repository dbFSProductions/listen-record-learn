<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Xerra</title>
<meta name="description" content="Catalan pronunciation trainer — listen, record, compare.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Xerra">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab sec-practise" data-tab="practise" aria-label="Practice">
    <span class="tab-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2l2-7 3 14 3-11 2 6h6"/></svg>
      <span>Practice</span>
    </span>
  </button>
  <button class="tab sec-add" data-tab="add" aria-label="Add">
    <span class="tab-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Add</span>
    </span>
  </button>
  <button class="tab sec-settings" data-tab="settings" aria-label="Settings">
    <span class="tab-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span>Settings</span>
    </span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="link" data-close-sheet>Done</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
